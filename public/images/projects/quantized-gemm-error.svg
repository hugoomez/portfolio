  <rect x="1835" y="630" width="430" height="100" rx="50" fill="#0e9f6e"/>
  <path d="M 1885 680 L 1905 700 L 1940 655" fill="none" stroke="#f5b942" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1965" y="692" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Scale format wins</text>

  <!-- title -->
